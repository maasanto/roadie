name: Linters

on:
  pull_request:
  push:
    branches: [develop]

concurrency:
  group: linters-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files
